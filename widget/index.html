<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ekt.kz — чат-ассистент</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="chat-shell" aria-labelledby="chat-title">
      <header>
        <p class="eyebrow">PRODUCT ASSISTANT</p>
        <h1 id="chat-title">Помощник по товарам</h1>
        <p class="hint">Прототип. Данные каталога доступны после подключения утверждённой интеграции.</p>
      </header>

      <section id="messages" class="messages" aria-live="polite">
        <article class="message assistant">Здравствуйте! Напишите, какой товар вы ищете.</article>
      </section>

      <form id="message-form" class="composer">
        <label class="sr-only" for="message">Сообщение</label>
        <textarea id="message" name="message" maxlength="4000" required placeholder="Например: нужен кабель ВВГ 3x2,5" rows="3"></textarea>
        <button id="send" type="submit">Отправить</button>
      </form>
      <p id="status" class="status" role="status"></p>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
