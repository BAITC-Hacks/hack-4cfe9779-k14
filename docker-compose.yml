services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chat}
      POSTGRES_USER: ${POSTGRES_USER:-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chat} -d ${POSTGRES_DB:-chat}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      APP_NAME: ${APP_NAME:-Chat Service API}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chat}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-chat}
      EKT_API_BASE_URL: ${EKT_API_BASE_URL:-https://ekt.kz/api/}
      EKT_API_USERNAME: ${EKT_API_USERNAME:-}
      EKT_API_PASSWORD: ${EKT_API_PASSWORD:-}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-15}
      LLM_HISTORY_MESSAGE_LIMIT: ${LLM_HISTORY_MESSAGE_LIMIT:-12}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-10485760}
      ATTACHMENT_MAX_XLSX_SHEETS: ${ATTACHMENT_MAX_XLSX_SHEETS:-20}
      ATTACHMENT_MAX_XLSX_ROWS: ${ATTACHMENT_MAX_XLSX_ROWS:-10000}
      ATTACHMENT_MAX_XLSX_COLUMNS: ${ATTACHMENT_MAX_XLSX_COLUMNS:-100}
      ATTACHMENT_LLM_MAX_CHARS: ${ATTACHMENT_LLM_MAX_CHARS:-12000}
      ATTACHMENT_TTL_SECONDS: ${ATTACHMENT_TTL_SECONDS:-86400}
      CLEANUP_BATCH_SIZE: ${CLEANUP_BATCH_SIZE:-1000}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
